include:
  # --- Standard setup (no dongle): left half is central ---
  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: lily58_left
  - board: nice_nano//zmk
    shield: lily58_right nice_view_adapter nice_view
    artifact-name: lily58_right

  # --- Dongle setup: nRF52840 Dongle is central, both halves are peripherals ---
  # The right half uses the same lily58_right firmware in both setups.
  - board: nrf52840dongle//zmk
    shield: lily58_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: dongle_receiver
  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: dongle_lily58_left

  # --- Settings reset (flash before switching between setups) ---
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset_nice_nano
  - board: nrf52840dongle//zmk
    shield: settings_reset
    artifact-name: settings_reset_dongle
